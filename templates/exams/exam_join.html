{% extends 'base.html' %}

{% block title %}Join Private Exam | ExamFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3">Find an Exam</h3>
            <p class="text-muted">Enter the exam code shared by the examiner. You only need this for private exams,
                public exams are available from the Exams list.</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Exam Code</label>
                    <input type="text" name="exam_code" class="form-control" placeholder="EXM-ABC123" required>
                </div>
                <div class="d-flex gap-2">
                    <a href="{% url 'exam_list' %}" class="btn btn-outline-secondary">Back</a>
                    <button type="submit" class="btn btn-primary">Open Exam</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
