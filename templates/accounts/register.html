{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Register | ExamFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm mt-5">
            <h3 class="text-center mb-4">Create an Account</h3>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-accent px-5 w-100">Register</button>
                </div>
            </form>
            <hr class="my-4">
            <div class="text-center">
                <span class="text-muted">Already have an account?</span>
                <a href="{% url 'login' %}" class="fw-bold text-decoration-none">Login here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
