{% extends 'base.html' %}

{% block title %}Reset Password | ExamFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm mt-5">
            <h3 class="text-center mb-3">Reset Your Password</h3>
            <p class="text-muted text-center">Enter your account email and we will send you a reset link.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="text-end">
                    <button type="submit" class="btn btn-primary">Send Reset Link</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
