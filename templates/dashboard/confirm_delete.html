{% extends 'dashboard/base_dashboard.html' %}

{% block content_title %}Confirm Deletion{% endblock %}

{% block content %}
<div class="card shadow-sm border-danger">
    <div class="card-body text-center py-5">
        <i class="fas fa-exclamation-triangle fa-4x text-danger mb-4"></i>
        <h3>Are you sure you want to delete "{{ object }}"?</h3>
        <p class="text-muted mb-4">This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            <a href="javascript:history.back()" class="btn btn-secondary px-4 me-2">Cancel</a>
            <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
        </form>
    </div>
</div>
{% endblock %}
