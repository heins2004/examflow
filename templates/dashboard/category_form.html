{% extends 'dashboard/base_dashboard.html' %}
{% load bootstrap_form_tags %}

{% block content_title %}{{ object|yesno:"Edit Category,Create Category" }}{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-4">
                <a href="{% url 'dashboard_categories' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Category</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
